<style>

.detail{position:fixed;inset:0;background:#0b2420aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.detail.show{display:flex}.sheet{max-width:540px;width:100%;background:white;border-radius:22px;padding:20px;box-shadow:0 30px 80px #0005}.close{float:right;border:0;background:#f4f6f5;border-radius:50%;width:36px;height:36px}.why{background:var(--mint);border-radius:14px;padding:14px;margin:14px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.meta div{background:#f7f8f7;border-radius:12px;padding:10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}a.btn{display:inline-block;text-decoration:none;background:var(--green);color:white;border-radius:12px;padding:10px 12px;font-size:13px}a.btn.alt{background:#fff;color:var(--green);border:1px solid var(--green)}

@media(max-width:780px){.app{padding:10px}header{align-items:start;flex-direction:column}h1{font-size:31px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.layout{grid-template-columns:1fr}.map{height:420px}.list{max-height:none}.panel.listpanel{order:-1}}
</style></head><body><div class="app"><header><div><h1>Indie Stortford</h1><p class="strap">Find local places. Understand why they’re independent. Spend locally with confidence.</p></div><div class="badge">Prototype • Bishop’s Stortford • v0.1</div></header>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const search=document.getElementById('search'), category=document.getElementById('category'), indie=document.getElementById('indie'), list=document.getElementById('list'), map=document.getElementById('map');
DATA.forEach(d=>{const p=document.createElement('button');p.className='pin'+(d.conditional?' conditional':'');p.style.left=d.x+'%';p.style.top=d.y+'%';p.dataset.id=d.id;p.title=d.name;p.innerHTML='<span>'+d.id+'</span>';p.onclick=()=>openDetail(d.id);map.appendChild(p)});
function filtered(){let q=search.value.toLowerCase().trim();return DATA.filter(d=>{if(q&&!(`${d.name} ${d.category} ${d.reason}`).toLowerCase().includes(q)))return false;if(category.value!=='All categories'&&d.bucket!==category.value)return false;if(indie.value==='Local only'&&!d.class.toLowerCase().includes('local'))return false;if(indie.value==='Regional included'&&!(d.class.toLowerCase().includes('regional')||d.class.toLowerCase().includes('local')))return false;if(indie.value==='Confirmed only'&&!d.verification.toLowerCase().startsWith('confirmed'))return false;return true})}
function render(){let rows=filtered(),ids=new Set(rows.map(x=>x.id));document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('hidden',!ids.has(+p.dataset.id)));document.getElementById('count').textContent=rows.length+' places';document.getElementById('mapCount').textContent=rows.length+' shown';list.innerHTML=rows.length?rows.map(d=>`<div class="card" onclick="openDetail(${d.id})"><div class="row"><div><div class="name">${esc(d.name)}</div><div class="cat">${esc(d.category)}</div></div><div class="small">#${d.id}</div></div><span class="pill ${d.conditional?'conditional':''}">${esc(d.class)}</span></div>`).join(''):'<div class="empty">No businesses match those filters.</div>'}

[search,category,indie].forEach(x=>x.addEventListener('input',render));render();</script></body></html>
