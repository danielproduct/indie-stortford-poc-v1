<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Indie Stortford — MVP Prototype</title>
  <style>
    :root {
      --ink:#16342f; --green:#0f6b55; --mint:#e9f4ed; --cream:#fbfaf5; --line:#dfe8e3; --muted:#61716c; --amber:#b66a12; --shadow:0 10px 30px rgba(20,50,45,.10)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}
    .app{max-width:1180px;margin:auto;padding:18px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:18px 2px 16px}
    h1{font-family:Georgia,serif;font-size:36px;margin:0}.strap{margin:4px 0 0;color:var(--muted)}
    .badge{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    .controls{display:grid;grid-template-columns:1.4fr repeat(2,auto);gap:10px;margin-bottom:14px}
    input,select,button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink)}
    button{cursor:pointer}
    button.active{background:var(--green);color:#fff;border-color:var(--green)}
    .layout{display:grid;grid-template-columns:1.12fr .88fr;gap:14px;min-height:650px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    .maphead,.listhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:var(--muted)}
    .map{position:relative;height:600px;background:linear-gradient(36deg,#eef5ef 25%,#f8f3e8 25%,#f8f3e8 50%,#eef5ef 50%,#eef5ef 75%,#f8f3e8 75%);background-size:70px 70px;overflow:hidden}
    .map:before,.map:after{content:"";position:absolute;background:#d9e7eb;transform:rotate(-14deg);border-radius:30px}.map:before{width:900px;height:42px;left:-140px;top:250px}.map:after{width:700px;height:26px;left:120px;top:390px;transform:rotate(68deg)}
    .townlabel{position:absolute;left:45%;top:45%;font-family:Georgia,serif;font-size:30px;opacity:.22;z-index:1;text-align:center}
    .pin{position:absolute;z-index:2;width:27px;height:27px;border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);background:var(--green);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer}
    .pin span{display:block;transform:rotate(45deg);color:#fff;font-size:10px;text-align:center;line-height:22px}
    .pin.conditional{background:var(--amber)}
    .pin.hidden{display:none}
    .mapnote{position:absolute;z-index:3;bottom:14px;left:14px;background:#fffffff0;border:1px solid var(--line);padding:9px 11px;border-radius:10px;font-size:11px;color:var(--muted);max-width:260px}
    .list{max-height:600px;overflow:auto;padding:8px}.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px;background:#fff;cursor:pointer;transition:.15s}.card:hover,.card.selected{border-color:#8bb7a7;background:#f5fbf7;transform:translateY(-1px)}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-weight:750;font-size:16px}.cat{font-size:12px;color:var(--muted);margin-top:2px}.pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:var(--mint);font-size:11px;color:var(--green)}.pill.conditional{background:#fff0dc;color:#9b5a0e}
    .detail{position:fixed;inset:0;background:#0b2420aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.detail.show{display:flex}.sheet{max-width:540px;width:100%;background:#fff;border-radius:22px;padding:20px;box-shadow:0 30px 80px #000d}.close{float:right;border:0;background:#f4f6f5;border-radius:50%;width:36px;height:36px}.why{background:var(--mint);border-radius:14px;padding:14px;margin:14px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.meta div{background:#f7f9f7;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.a.btn{display:inline-block;text-decoration:none;background:var(--green);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px}.a.btn.alt{background:#fff;color:var(--green);border:1px solid var(--green)}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    @media (max-width:780px){.app{padding:10px}header{align-items:start;flex-direction:column}h1{font-size:31px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.layout{grid-template-columns:1fr}.map{height:420px}.list{max-height:none}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Indie Stortford</h1>
        <p class="strap">Find local places. Understand why they’re independent. Spend locally with confidence.</p>
      </div>
      <div class="badge">Prototype • Bishop's Stortford v0.1</div>
    </header>

    <div class="controls">
      <input id="search" placeholder="Search coffee, food, shops, businesses…">
      <select id="category">
        <option>All categories</option>
        <option>Food & Drink</option>
        <option>Shops & Services</option>
        <option>Health & Beauty</option>
        <option>Home & Gifts</option>
        <option>Things to Do</option>
      </select>
      <select id="indie">
        <option>All independents</option>
        <option>Local only</option>
        <option>Regional included</option>
        <option>Confirmed only</option>
      </select>
    </div>

    <div class="layout">
      <section class="panel">
        <div class="maphead"><strong>Explore the town</strong><span id="mapCount" class="small"></span></div>
        <div class="map" id="map">
          <div class="townlabel">Bishop's<br>Stortford</div>
          <div class="mapnote">Prototype map only — pin positions are schematic until addresses are geocoded and verified.</div>
        </div>
      </section>

      <section class="panel listpanel">
        <div class="listhead"><strong>Independent places</strong><span id="count" class="small"></span></div>
        <div id="list" class="list"></div>
      </section>
    </div>
  </div>

  <div id="detail" class="detail" onclick="if(event.target===this)closeDetail()">
    <div class="sheet">
      <button class="close" onclick="closeDetail()">×</button>
      <div id="detailBody"></div>
    </div>
  </div>

      {id:22,name:'No. 14',category:'Bar / Restaurant',bucket:'Food & Drink',class:'Local Independent',confidence:'High',reason:'No. 14 is a single-site independent bar and restaurant in the heart of Bishop’s Stortford.',evidence:'No. 14 is a single-site independent bar and restaurant in the heart of Bishop’s Stortford.',scale:'Single known venue',verification:'Confirmed - current entity',x:50,y:30,conditional:false},
      {id:23,name:'Roni’s',category:'Restaurant',bucket:'Food & Drink',class:'Local Independent',confidence:'Medium-High',reason:'Roni’s is a familiar local restaurant known for a strong independent offer and personal hospitality.',evidence:'Roni’s is a familiar local restaurant known for a strong independent offer and personal hospitality.',scale:'Single known venue',verification:'Confirmed - operating footprint',x:83,y:53,conditional:false},
      {id:24,name:'Skew',category:'Restaurant',bucket:'Food & Drink',class:'Local Independent',confidence:'High',reason:'Skew is a chef-led independent restaurant with a clear local identity and a genuine neighbourhood following.',evidence:'Skew is a chef-led independent restaurant with a clear local identity and a genuine neighbourhood following.',scale:'Single venue',verification:'Confirmed',x:60,y:55,conditional:false},

      {id:27,name:'Rosey Lea Tea Room',category:'Cafe / Tearoom',bucket:'Food & Drink',class:'Regional Independent',confidence:'High',reason:'Rosey Lea is an independent café and tearoom concept founded locally and known for a distinctive personal touch.',evidence:'Rosey Lea is an independent café and tearoom concept founded locally and known for a distinctive personal touch.',scale:'Approx. 4 listed locations/venues',verification:'Confirmed',x:82,y:45,conditional:false},
      {id:28,name:'Bishop’s Butchers',category:'Butcher / Cafe',bucket:'Food & Drink',class:'Local Independent',confidence:'High',reason:'Bishop’s Butchers is a local independent shop with a strong food-first identity and a trusted customer base.',evidence:'Bishop’s Butchers is a local independent shop with a strong food-first identity and a trusted customer base.',scale:'Single local shop',verification:'Confirmed',x:47,y:79,conditional:false},

    ];

    const esc = s => String(s ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const search = document.getElementById('search');
    const category = document.getElementById('category');
    const indie = document.getElementById('indie');
    const list = document.getElementById('list');
    const map = document.getElementById('map');

    DATA.forEach(d => {
      const p = document.createElement('button');
      p.className = 'pin' + (d.conditional ? ' conditional' : '');
      p.style.left = d.x + '%';
      p.style.top = d.y + '%';
      p.dataset.id = d.id;
      p.title = d.name;
      p.innerHTML = '<span>' + d.id + '</span>';
      p.onclick = () => openDetail(d.id);
      map.appendChild(p);
    });

    function filtered() {
      let q = search.value.toLowerCase().trim();
      return DATA.filter(d => {
        if (q && !(`${d.name} ${d.category} ${d.reason}`.toLowerCase().includes(q))) return false;
        if (category.value !== 'All categories' && d.bucket !== category.value) return false;
        if (indie.value === 'Local only' && !d.class.toLowerCase().includes('local')) return false;
        if (indie.value === 'Regional included' && !(d.class.toLowerCase().includes('regional') || d.class.toLowerCase().includes('local'))) return false;
        if (indie.value === 'Confirmed only' && d.verification.toLowerCase().startsWith('probable')) return false;
        return true;
      });
    }

    function render() {
      let rows = filtered();
      let ids = new Set(rows.map(x => x.id));
      document.querySelectorAll('.pin').forEach(p => p.classList.toggle('hidden', !ids.has(+p.dataset.id)));
      document.getElementById('count').textContent = rows.length + ' places';
      document.getElementById('mapCount').textContent = rows.length + ' shown';
      list.innerHTML = rows.length ? rows.map(d => `
        <div class="card ${d.id === Number(document.querySelector('.card.selected')?.dataset?.id) ? 'selected' : ''}" data-id="${d.id}" onclick="openDetail(${d.id})">
          <div class="row">
            <div>
              <div class="name">${esc(d.name)}</div>
              <div class="cat">${esc(d.category)}</div>
            </div>
            <div class="small">#${d.id}</div>
          </div>
          <span class="pill ${d.conditional ? 'conditional' : ''}">${esc(d.class)}</span>
        </div>
      `).join('') : '<div class="empty">No businesses match those filters.</div>';
    }

    function openDetail(id) {
      let d = DATA.find(x => x.id === id);
      if (!d) return;
      document.getElementById('detailBody').innerHTML = `
        <h2 style="margin:6px 45px 2px 0">${esc(d.name)}</h2>
        <div class="cat">${esc(d.category)} • ${esc(d.bucket)}</div>
        <span class="pill ${d.conditional ? 'conditional' : ''}">${esc(d.class)}</span>

        <div class="why">
          <strong>Local story</strong>
          <p style="margin:8px 0 0;line-height:1.45;">${esc(d.reason)}</p>
        </div>

        <div class="meta">
          <div><b>Scale</b><br>${esc(d.scale)}</div>
          <div><b>Verification</b><br>${esc(d.verification)}</div>
          <div><b>Confidence</b><br>${esc(d.confidence)}</div>
          <div><b>Evidence</b><br>${esc(d.evidence)}</div>
        </div>

        <div class="actions">
          <a class="btn" href="https://www.google.com/maps/search/${encodeURIComponent(d.name + ' Bishop\'s Stortford')}" target="_blank" rel="noreferrer">Get directions</a>
          <a class="btn alt" href="#" onclick="closeDetail(); return false;">Close</a>
        </div>
      `;
      document.getElementById('detail').classList.add('show');
      document.querySelectorAll('.card').forEach(card => card.classList.toggle('selected', Number(card.dataset.id) === id));
    }

    function closeDetail() {
      document.getElementById('detail').classList.remove('show');
    }

    [search, category, indie].forEach(x => x.addEventListener('input', render));
    render();
  </script>
</body>
</html>
